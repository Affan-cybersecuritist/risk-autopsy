[pytest]
# Found by watching CI fail on its first real run: bare `pytest` (unlike
# `python -m pytest`) does not add the repo root to sys.path, so
# `from backend import ...` fails everywhere with ModuleNotFoundError. This
# makes both invocations work identically, rather than relying on every
# CI config and every judge's terminal to happen to use `python -m pytest`.
pythonpath = .
